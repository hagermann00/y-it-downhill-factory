  <!-- Sign / Placard Held by PosiBot -->
  <g transform="translate(172, 34)" filter="url(#shadow)">
    <line x1="0" y1="86" x2="20" y2="86" stroke="#785A3C" stroke-width="5"/>
    <rect x="16" y="8" width="352" height="148" rx="8" fill="#FFFBEB" stroke="#1E293B" stroke-width="3"/>
    <rect x="24" y="16" width="336" height="132" rx="4" fill="none" stroke="#D97706" stroke-width="1.2" stroke-dasharray="5,3"/>
    <text x="192" y="68" text-anchor="middle" font-family="'Big Shoulders Display', 'Impact', sans-serif" font-size="28" font-weight="900" fill="#111827" letter-spacing="0.8">FIFTH RESET IS 15% OFF!</text>
    <line x1="48" y1="86" x2="336" y2="86" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="192" y="114" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="11.5" font-weight="600" fill="#475569">(Median trader buys 4.2 challenges: $1,840 spent)</text>
    <text x="192" y="136" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="9.5" fill="#94A3B8">[DELIVERY: WHITEBOARD EASEL · FIXED CYAN SMILE ACTIVE]</text>
