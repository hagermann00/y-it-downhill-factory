<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320" width="560" height="320">
  <rect x="2" y="2" width="556" height="316" rx="8" fill="#FFFFFF" stroke="#1E293B" stroke-width="2"/>
  <rect x="2" y="2" width="556" height="58" rx="8" fill="#0F172A"/>
  <text x="18" y="24" font-family="'IBM Plex Mono', monospace" font-size="10" font-weight="700" fill="#38BDF8">CHART EXHIBIT // HOURLY METER</text>
  <text x="18" y="45" font-family="'Big Shoulders Display', sans-serif" font-size="18" font-weight="800" fill="#FFFFFF">What Do the Top 2.4% Survivors Earn Per Hour?</text>
  <rect x="372" y="14" width="172" height="34" rx="5" fill="#DC2626"/>
  <text x="458" y="35" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="11" font-weight="700" fill="#FFFFFF">$6.40/HR vs $29.76/HR</text>
  
    <text x="18" y="100" font-family="'Work Sans', sans-serif" font-size="11.5" font-weight="600" fill="#1E293B">Net-Unprofitable Starters (97.6%)</text>
    <rect x="195" y="86" width="8" height="20" rx="3" fill="#DC2626"/>
    <text x="211" y="100" font-family="'IBM Plex Mono', monospace" font-size="11" font-weight="700" fill="#0F172A">&lt;= $0.00/hr</text>
    <text x="18" y="134" font-family="'Work Sans', sans-serif" font-size="11.5" font-weight="600" fill="#1E293B">Surviving Prop Traders (Top 2.4%)</text>
    <rect x="195" y="120" width="35" height="20" rx="3" fill="#DC2626"/>
    <text x="238" y="134" font-family="'IBM Plex Mono', monospace" font-size="11" font-weight="700" fill="#0F172A">$6.40/hr (26.5h/wk)</text>
    <text x="18" y="168" font-family="'Work Sans', sans-serif" font-size="11.5" font-weight="600" fill="#1E293B">US Median Hourly Wage (BLS)</text>
    <rect x="195" y="154" width="167" height="20" rx="3" fill="#DC2626"/>
    <text x="370" y="168" font-family="'IBM Plex Mono', monospace" font-size="11" font-weight="700" fill="#0F172A">$29.76/hr Benchmark</text>
    <text x="18" y="202" font-family="'Work Sans', sans-serif" font-size="11.5" font-weight="600" fill="#1E293B">SQL / Financial BI Analyst (BLS)</text>
    <rect x="195" y="188" width="250" height="20" rx="3" fill="#DC2626"/>
    <text x="453" y="202" font-family="'IBM Plex Mono', monospace" font-size="11" font-weight="700" fill="#0F172A">$44.50/hr Pivot</text>
  <line x1="16" y1="286" x2="544" y2="286" stroke="#CBD5E1" stroke-width="1"/>
  <text x="18" y="304" font-family="'IBM Plex Mono', monospace" font-size="9.5" fill="#475569">Source: Prop Cohort Study &amp; US BLS OEWS [F-003, F-013]</text>
